# Wealth portal — local stack.
#
# Everyday development (you run the backend and frontend yourself):
#   docker compose up -d                 -> Postgres + Keycloak only
#
# Everything in containers (closest to production):
#   docker compose --profile app up --build -d
#   then open http://localhost:8081
#
# Keycloak admin console: http://localhost:8180  (credentials in .env)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealth
      POSTGRES_USER: ${DB_USER:-wealth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wealth}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wealth} -d wealth"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The address browsers use; it is also written into every token as the issuer.
      KC_HOSTNAME: http://localhost:8180
      # Lets the backend container reach Keycloak at keycloak:8080 internally.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Filled into the WEB_URL placeholder of the realm file (on Azure: the public web address).
      WEB_URL: http://localhost:8081
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro   # realm, roles and test users
      - keycloakdata:/opt/keycloak/data           # keeps users and 2FA setups between restarts

  # ---- Only with --profile app ----
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      SERVER_PORT: "8080"            # Nginx in the frontend image forwards to backend:8080
      DB_URL: jdbc:postgresql://postgres:5432/wealth
      DB_USER: ${DB_USER:-wealth}
      DB_PASSWORD: ${DB_PASSWORD:-wealth}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/wealth
      KEYCLOAK_JWKS: http://keycloak:8080/realms/wealth/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
  keycloakdata:
