# Serves the Angular app and forwards /api to Spring Boot, so the browser
# sees one origin and there are no CORS problems.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # lets Server-Sent Events stream
        proxy_read_timeout 1h;
    }

    # Runtime config must never be cached, so a redeploy takes effect at once.
    location = /app-config.json {
        add_header Cache-Control "no-store";
    }

    # Hashed bundles can be cached for a long time.
    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is an Angular route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
